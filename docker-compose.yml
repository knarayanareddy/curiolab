# LOCAL synthetic/draft environment only; no AWS credentials or private camera media.
x-app: &app
  build: .
  image: curiolab-local
  init: true
  restart: "no"
services:
  session-relay:
    <<: *app
    command: [pnpm, dev:relay]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  content:
    <<: *app
    command: [pnpm, dev:content]
    ports: ["127.0.0.1:8081:8081"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8081/episode.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  firetv:
    <<: *app
    ports: ["127.0.0.1:5173:5173"]
    environment:
      RELAY_URL: http://session-relay:8080
      CONTENT_URL: http://content:8081
    depends_on:
      session-relay: { condition: service_healthy }
      content: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5173/api/health').then(r=>r.json()).then(v=>process.exit(v.status==='ready'&&v.services?.status==='ready'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
